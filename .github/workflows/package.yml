name: Package

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: windows-latest

    # Job level: tsdown and vite inline these during `pnpm build`; `pnpm package`
    # only zips the assets `pnpm build` produced.
    env:
      PCA_MOD_URL: https://www.nexusmods.com/skyrimspecialedition/mods/23852?tab=files
      PCA_TELEMETRY_ENABLED: 'true'
      PCA_TELEMETRY_API_URL: ${{ secrets.PCA_TELEMETRY_API_URL }}
      PCA_TELEMETRY_API_KEY: ${{ secrets.PCA_TELEMETRY_API_KEY }}

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Package
        run: pnpm package

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: './dist/PCA.7z'
