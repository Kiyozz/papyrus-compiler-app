name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Version PR / tag
    runs-on: ubuntu-latest

    outputs:
      published: ${{ steps.changesets.outputs.published }}
      version: ${{ steps.version.outputs.version }}
      public-version: ${{ steps.version.outputs.public-version }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # Pending changesets -> open/refresh the bot version PR.
      # None left (PR merged) -> `changeset tag` creates vX.Y.Z locally.
      #
      # createGithubReleases stays off because the action can only create a
      # published release, and we want a draft until the NexusMods upload runs.
      # It also owns the tag push, so we do that ourselves below.
      - name: Version pull request or tag
        id: changesets
        uses: changesets/action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: pnpm changeset:version
          publish: pnpm changeset:tag
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
          createGithubReleases: false

      - name: Read released version
        id: version
        if: steps.changesets.outputs.published == 'true'
        run: |
          echo "version=${{ fromJson(steps.changesets.outputs.publishedPackages)[0].version }}" >> "$GITHUB_OUTPUT"
          echo "public-version=$(node -p 'require("./package.json").publicVersion')" >> "$GITHUB_OUTPUT"

      - name: Push tag
        if: steps.changesets.outputs.published == 'true'
        run: git push origin 'v${{ steps.version.outputs.version }}'

  package:
    name: Package
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: windows-latest

    # Job level: tsdown and vite inline these during `pnpm build`; `pnpm package`
    # only zips the assets `pnpm build` produced.
    env:
      PCA_MOD_URL: https://www.nexusmods.com/skyrimspecialedition/mods/23852?tab=files
      PCA_TELEMETRY_ENABLED: 'true'
      PCA_TELEMETRY_API_URL: ${{ secrets.PCA_TELEMETRY_API_URL }}
      PCA_TELEMETRY_API_KEY: ${{ secrets.PCA_TELEMETRY_API_KEY }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: v${{ needs.release.outputs.version }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Package
        run: pnpm package

      - name: Extract release notes
        shell: bash
        run: >-
          node scripts/extract-changelog.mjs '${{ needs.release.outputs.version }}'
          > release-notes.md

      # TODO: drop --draft once the NexusMods upload step below is in place.
      # The app polls /releases?per_page=1 unauthenticated, which hides drafts,
      # so nothing is announced in-app until the release is published by hand.
      - name: Draft GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create 'v${{ needs.release.outputs.version }}' \
            --title 'PCA ${{ needs.release.outputs.public-version }}' \
            --notes-file release-notes.md \
            --draft \
            'dist/PCA.7z'

      # TODO: upload to NexusMods with Nexus-Mods/upload-action (v3 API, still
      # in beta). The mod is skyrimspecialedition/mods/23852.
      #
      # Two ids are still missing:
      #   - file_id: the file to add a version to, from "API Info" in the Files
      #     tab of the mod page.
      #   - mod_id: NOT the 23852 from the URL (that is the game-scoped id).
      #     Resolve it once via GET /v3/games/skyrimspecialedition/mods/23852.
      # Also needs a PCA_NEXUSMODS_API_KEY secret.
      #
      # - name: Upload to NexusMods
      #   uses: Nexus-Mods/upload-action@v1.0.0-beta.10
      #   with:
      #     api_key: ${{ secrets.PCA_NEXUSMODS_API_KEY }}
      #     file_id: <file id, see above>
      #     mod_id: <mod id, see above>
      #     filename: dist/PCA.7z
      #     version: ${{ needs.release.outputs.public-version }}
      #     changelog: <contents of release-notes.md>
      #     update_mod_version: true
